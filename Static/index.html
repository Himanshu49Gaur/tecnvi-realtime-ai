<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnvi-AI | Realtime AI Backend Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
        }

        .control-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 250px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            width: 100%;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-disconnected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-connected { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-streaming { background: rgba(6, 182, 212, 0.2); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.3); }

        .chat-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 450px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg-assistant {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .msg-system {
            align-self: center;
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
            font-size: 0.75rem;
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
        }

        .tool-badge {
            align-self: flex-start;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fde68a;
            font-size: 0.8rem;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-family: monospace;
        }

        .input-area {
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        .summary-card {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: none;
        }

        .summary-card h4 {
            color: #6ee7b7;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .summary-card p {
            font-size: 0.85rem;
            color: #d1fae5;
            line-height: 1.5;
        }

        .preset-prompts {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Tecnvi-AI Realtime Backend</div>
        <div id="statusBadge" class="status-badge status-disconnected">Disconnected</div>
    </header>

    <div class="container">
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="input-group">
                <label for="sessionIdInput">Session ID:</label>
                <input type="text" id="sessionIdInput" value="sess_demo_101">
            </div>
            <button id="connectBtn" class="btn" onclick="toggleConnection()">Connect Session</button>
        </div>

        <!-- Preset Quick Tools Prompts -->
        <div class="preset-prompts">
            <span class="chip" onclick="sendPreset('Fetch account info for ACC-101')">👤 Tool: Account Details (ACC-101)</span>
            <span class="chip" onclick="sendPreset('Check current weather in London')">🌤️ Tool: Weather (London)</span>
            <span class="chip" onclick="sendPreset('Calculate a quote for 40 hours of ai_consulting')">💰 Tool: Quote (AI Consulting)</span>
        </div>

        <!-- Chat Display Box -->
        <div class="chat-box">
            <div id="chatMessages" class="chat-messages">
                <div class="msg-bubble msg-system">Click "Connect Session" to establish a real-time WebSocket connection.</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message or prompt..." onkeydown="if(event.key==='Enter') sendMessage()" disabled>
                <button id="sendBtn" class="btn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>

        <!-- Post-Session Summary Card -->
        <div id="summaryCard" class="summary-card">
            <h4>📊 Post-Session Summary & Metrics</h4>
            <p id="summaryText">Session disconnected. Summarizing conversation transcript...</p>
        </div>
    </div>

    <script>
        let ws = null;
        let activeSessionId = '';
        let currentAssistantBubble = null;

        function updateStatus(statusText, className) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = statusText;
            badge.className = `status-badge ${className}`;
        }

        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            const sessionInput = document.getElementById('sessionIdInput');
            activeSessionId = sessionInput.value.trim() || 'sess_' + Math.random().toString(36).substring(2, 9);
            sessionInput.value = activeSessionId;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/session/${activeSessionId}`;

            ws = new WebSocket(wsUrl);
            updateStatus('Connecting...', 'status-disconnected');

            ws.onopen = () => {
                updateStatus('Connected', 'status-connected');
                document.getElementById('connectBtn').textContent = 'Disconnect & Summarize';
                document.getElementById('connectBtn').className = 'btn btn-danger';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('summaryCard').style.display = 'none';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            ws.onclose = () => {
                updateStatus('Disconnected', 'status-disconnected');
                document.getElementById('connectBtn').textContent = 'Connect Session';
                document.getElementById('connectBtn').className = 'btn';
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                appendSystemMessage('Session connection closed. Fetching post-session summary...');
                fetchPostSessionSummary(activeSessionId);
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
                appendSystemMessage('WebSocket error occurred.');
            };
        }

        function handleServerMessage(data) {
            const chatMessages = document.getElementById('chatMessages');

            if (data.type === 'system') {
                appendSystemMessage(`[System]: ${data.message || 'Connected'}`);
            } else if (data.type === 'stream_start') {
                updateStatus('Streaming Token...', 'status-streaming');
                currentAssistantBubble = document.createElement('div');
                currentAssistantBubble.className = 'msg-bubble msg-assistant';
                currentAssistantBubble.textContent = '';
                chatMessages.appendChild(currentAssistantBubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else if (data.type === 'token') {
                if (!currentAssistantBubble) {
                    currentAssistantBubble = document.createElement('div');
                    currentAssistantBubble.className = 'msg-bubble msg-assistant';
                    chatMessages.appendChild(currentAssistantBubble);
                }
                currentAssistantBubble.textContent += data.content;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else if (data.type === 'tool_executing') {
                const badge = document.createElement('div');
                badge.className = 'tool-badge';
                badge.textContent = `⚙️ Executing Tool: ${data.tool_name}(${JSON.stringify(data.args)})`;
                chatMessages.appendChild(badge);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else if (data.type === 'tool_completed') {
                const badge = document.createElement('div');
                badge.className = 'tool-badge';
                badge.style.borderColor = 'rgba(16, 185, 129, 0.4)';
                badge.style.color = '#a7f3d0';
                badge.textContent = `✅ Tool Result (${data.tool_name}): ${JSON.stringify(data.result)}`;
                chatMessages.appendChild(badge);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else if (data.type === 'stream_complete') {
                updateStatus('Connected', 'status-connected');
                currentAssistantBubble = null;
            } else if (data.type === 'error') {
                appendSystemMessage(`❌ Error: ${data.message}`);
                updateStatus('Connected', 'status-connected');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            // Append User Bubble
            const chatMessages = document.getElementById('chatMessages');
            const userBubble = document.createElement('div');
            userBubble.className = 'msg-bubble msg-user';
            userBubble.textContent = text;
            chatMessages.appendChild(userBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Send WS Frame
            ws.send(JSON.stringify({ type: 'message', content: text }));
            input.value = '';
        }

        function sendPreset(text) {
            const input = document.getElementById('messageInput');
            input.value = text;
            if (ws && ws.readyState === WebSocket.OPEN) {
                sendMessage();
            }
        }

        function appendSystemMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            const sysMsg = document.createElement('div');
            sysMsg.className = 'msg-bubble msg-system';
            sysMsg.textContent = text;
            chatMessages.appendChild(sysMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function fetchPostSessionSummary(sessionId) {
            const summaryCard = document.getElementById('summaryCard');
            const summaryText = document.getElementById('summaryText');
            summaryCard.style.display = 'block';
            summaryText.textContent = 'Analyzing conversation transcript with LLM...';

            setTimeout(async () => {
                try {
                    const response = await fetch(`/api/session/${sessionId}`);
                    const data = await response.json();
                    if (data.session && data.session.summary) {
                        summaryText.innerHTML = `<strong>Summary:</strong> ${data.session.summary}<br><br><small>⚡ <strong>Duration:</strong> ${data.session.duration_seconds || '0'}s | <strong>Total Events Logged:</strong> ${data.event_count || 0}</small>`;
                    } else {
                        summaryText.textContent = 'Session finalized. Summary stored in Supabase database.';
                    }
                } catch (e) {
                    summaryText.textContent = 'Session terminated. Summary saved to database.';
                }
            }, 1200);
        }
    </script>
</body>
</html>
